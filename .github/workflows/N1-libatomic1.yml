name: Build N1 libatomic1 package

on:
  workflow_dispatch:
  push:
    branches:
      - 25.12
    paths:
      - '.github/workflows/N1-libatomic1.yml'

permissions:
  contents: read

concurrency:
  group: n1-libatomic1-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-libatomic:
    name: Build libatomic1 for N1 (aarch64_cortex-a53)
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout Kwrt repository
        uses: actions/checkout@v4

      - name: Install OpenWrt build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses5-dev libssl-dev python3-setuptools rsync swig \
            unzip zlib1g-dev file wget python3-pyelftools libpython3-dev \
            libelf-dev libgmp3-dev libmpc-dev
          sudo apt-get clean

      - name: Clone OpenWrt 25.12 source
        run: |
          set -euo pipefail
          git clone --depth 1 --branch openwrt-25.12 \
            https://github.com/openwrt/openwrt.git openwrt
          echo "OPENWRT_COMMIT=$(git -C openwrt rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "OpenWrt source commit: $(git -C openwrt rev-parse HEAD)"

      - name: Apply the same Amlogic target definition used by Kwrt
        run: |
          set -euo pipefail
          git clone --depth 1 --branch istoreos-25.12 --filter=blob:none --sparse \
            https://github.com/istoreos/istoreos.git istoreos-overlay
          git -C istoreos-overlay sparse-checkout set \
            target/linux/amlogic package/boot/uboot-amlogic-prebuilt
          cp -rn istoreos-overlay/target/linux/amlogic openwrt/target/linux/
          mkdir -p openwrt/package/boot
          cp -rn istoreos-overlay/package/boot/uboot-amlogic-prebuilt openwrt/package/boot/
          test -f openwrt/target/linux/amlogic/Makefile
          grep -E '^(BOARD|SUBTARGETS|KERNEL_PATCHVER):=' openwrt/target/linux/amlogic/Makefile
          echo "ISTOREOS_COMMIT=$(git -C istoreos-overlay rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Configure N1 target and libatomic
        working-directory: openwrt
        run: |
          set -euo pipefail
          cat > .config <<'EOF'
          CONFIG_TARGET_amlogic=y
          CONFIG_TARGET_amlogic_meson=y
          CONFIG_TARGET_MULTI_PROFILE=y
          CONFIG_TARGET_ALL_PROFILES=y
          CONFIG_PACKAGE_libgcc=y
          CONFIG_PACKAGE_libatomic=y
          EOF

          make defconfig

          echo "===== Target configuration ====="
          grep -E '^CONFIG_TARGET_(amlogic|amlogic_meson|MULTI_PROFILE|ALL_PROFILES)=' .config
          echo "===== GCC and package selection ====="
          grep -E '^(CONFIG_GCC_USE_VERSION_|CONFIG_PACKAGE_libgcc=|CONFIG_PACKAGE_libatomic=)' .config || true

          grep -qx 'CONFIG_TARGET_amlogic=y' .config
          grep -qx 'CONFIG_TARGET_amlogic_meson=y' .config
          grep -qx 'CONFIG_PACKAGE_libatomic=y' .config
          grep -qx 'CONFIG_PACKAGE_libgcc=y' .config

      - name: Build target toolchain (serial)
        working-directory: openwrt
        run: |
          set -euo pipefail
          make -j1 toolchain/install V=s 2>&1 | tee "$GITHUB_WORKSPACE/n1-toolchain.log"

      - name: Build libatomic1 and matching libgcc1 IPKs
        working-directory: openwrt
        run: |
          set -euo pipefail
          make -j1 package/libs/toolchain/compile V=s 2>&1 | tee "$GITHUB_WORKSPACE/n1-toolchain-packages.log"

      - name: Package and verify N1 runtime IPKs
        working-directory: openwrt
        run: |
          set -euo pipefail
          out="$GITHUB_WORKSPACE/n1-libatomic-artifact"
          work="$GITHUB_WORKSPACE/n1-ipkg-work"
          mkdir -p "$out/packages" "$work"

          target_staging="$(find staging_dir -maxdepth 1 -type d -name 'target-aarch64_cortex-a53_musl' -print -quit)"
          toolchain_staging="$(find staging_dir -maxdepth 1 -type d -name 'toolchain-aarch64_cortex-a53_gcc-*_musl' -print -quit)"
          test -n "$target_staging"
          test -n "$toolchain_staging"

          # Prefer target package staging. Only accept real ELF runtime files,
          # not linker scripts or development symlinks.
          find_runtime() {
            local name="$1" base candidate
            for base in "$target_staging" "$toolchain_staging"; do
              # -L follows staging symlinks while retaining the SONAME path.
              candidate="$(find -L "$base" -type f -name "$name" -print -quit)"
              if [ -n "$candidate" ]; then
                printf '%s\n' "$candidate"
                return 0
              fi
            done
            return 1
          }
          atomic_so="$(find_runtime 'libatomic.so.1')" || true
          gcc_so="$(find_runtime 'libgcc_s.so.1')" || true

          if [ -z "$atomic_so" ]; then
            echo "::error::libatomic.so.1 was not produced by the N1 GCC toolchain"
            find "$target_staging" "$toolchain_staging" -type f -iname '*atomic*' -print || true
            exit 1
          fi
          if [ -z "$gcc_so" ]; then
            echo "::error::libgcc_s.so.1 was not found in the N1 toolchain staging"
            find "$target_staging" "$toolchain_staging" -type f -iname '*libgcc*' -print || true
            exit 1
          fi

          build_one() {
            local pkg="$1" src="$2" soname="$3" version="$4" depends="$5"
            local root="$work/$pkg" library="$work/$pkg/lib/$soname"
            rm -rf "$root"
            mkdir -p "$root/lib" "$root/CONTROL"
            install -m 0755 "$src" "$library"
            file "$library"
            readelf -h "$library" | grep -Eq 'Machine:.*AArch64'
            actual_soname="$(readelf -d "$library" | sed -n 's/.*(SONAME).*[[]\(.*\)[]].*/\1/p')"
            [ "$actual_soname" = "$soname" ] || {
              echo "::error::Unexpected SONAME for $pkg: $actual_soname (expected $soname)"
              exit 1
            }
            cat > "$root/CONTROL/control" <<EOF
          Package: $pkg
          Version: $version
          Depends: $depends
          Architecture: aarch64_cortex-a53
          Section: libs
          Priority: optional
          Maintainer: GuC010/Kwrt build workflow
          Description: GCC runtime library built with the N1 OpenWrt 25.12 toolchain.
          EOF
            "$PWD/scripts/ipkg-build" "$root" "$out/packages" >/dev/null
          }

          # IPK is an ar archive containing control.tar.* and data.tar.*.
          # Do not treat the outer .ipk as a gzip tar archive.
          extract_ipk_member() {
            local ipk="$1" member="$2" dest="$3"
            local tmp="$work/ipk-inspect"
            rm -rf "$tmp"
            mkdir -p "$tmp"
            (cd "$tmp" && ar x "$ipk")
            local archive
            archive="$(find "$tmp" -maxdepth 1 -type f -name "$member" -print -quit)"
            [ -n "$archive" ] || {
              echo "::error::Missing $member in $ipk"
              return 1
            }
            case "$archive" in
              *.tar.gz|*.tgz) tar -xOzf "$archive" > "$dest" ;;
              *.tar.xz)       tar -xOJf "$archive" > "$dest" ;;
              *.tar.zst)      tar --zstd -xOf "$archive" > "$dest" ;;
              *.tar)          cat "$archive" > "$dest" ;;
              *) echo "::error::Unsupported archive format: $archive"; return 1 ;;
            esac
          }

          gcc_version="$(grep -m1 '^CONFIG_GCC_VERSION=' .config | cut -d= -f2 | tr -d '"')"
          [ -n "$gcc_version" ] || gcc_version="$(grep -m1 '^CONFIG_GCC_USE_VERSION_' .config | sed 's/.*VERSION_//;s/=y//')"
          pkg_version="${gcc_version:-14.3.0}-r5"

          build_one libgcc1 "$gcc_so" "libgcc_s.so.1" "$pkg_version" "libc"
          build_one libatomic1 "$atomic_so" "libatomic.so.1" "$pkg_version" "libgcc1"

          for pkg in "$out"/packages/*.ipk; do
            echo "===== $pkg ====="
            inspect="$work/$(basename "$pkg").inspect"
            mkdir -p "$inspect"
            rm -f "$work/control.tar.contents" "$work/data.tar.contents"
            extract_ipk_member "$pkg" "control.tar.gz" "$work/control.tar.contents" || {
              # Accept xz/zstd/uncompressed control archive names as emitted by other builders.
              archive_name="$(ar t "$pkg" | grep '^control\.tar' | head -n1)"
              [ -n "$archive_name" ] || exit 1
              extract_ipk_member "$pkg" "$archive_name" "$work/control.tar.contents"
            }
            tar -tf "$work/control.tar.contents" > "$inspect/control-files.txt"
            tar -xOf "$work/control.tar.contents" ./control > "$inspect/control"
            cat "$inspect/control"
            grep -qx 'Architecture: aarch64_cortex-a53' "$inspect/control"

            archive_name="$(ar t "$pkg" | grep '^data\.tar' | head -n1)"
            [ -n "$archive_name" ]
            extract_ipk_member "$pkg" "$archive_name" "$work/data.tar.contents"
            tar -tf "$work/data.tar.contents" > "$inspect/data-files.txt"
            grep -qE '^\./?lib/' "$inspect/data-files.txt"

            if [[ "$pkg" == *libatomic1_* ]]; then
              grep -qE '^\./?lib/libatomic\.so\.1$' "$inspect/data-files.txt"
              tar -xOf "$work/data.tar.contents" ./lib/libatomic.so.1 > "$work/extracted-libatomic.so.1"
              readelf -h "$work/extracted-libatomic.so.1" | grep -Eq 'Machine:.*AArch64'
              readelf -d "$work/extracted-libatomic.so.1" | grep -q 'SONAME.*libatomic.so.1'
            fi
          done

          {
            echo "Target: amlogic_meson / aarch64_cortex-a53"
            echo "OpenWrt branch: openwrt-25.12"
            echo "OpenWrt commit: $OPENWRT_COMMIT"
            echo "iStoreOS target overlay commit: $ISTOREOS_COMMIT"
            echo "GCC version: $pkg_version"
            echo
            echo "Included IPKs:"
            find "$out/packages" -maxdepth 1 -type f -name '*.ipk' -printf '%f\n' | sort
            echo
            echo "SHA256:"
            (cd "$out/packages" && sha256sum *.ipk)
          } > "$out/README-MANIFEST.txt"
          cat "$out/README-MANIFEST.txt"

      - name: Upload N1 libatomic runtime packages
        uses: actions/upload-artifact@v4
        with:
          name: n1-libatomic1-${{ github.run_number }}
          path: n1-libatomic-artifact/
          if-no-files-found: error
          retention-days: 30

      - name: Upload build diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: n1-libatomic-build-diagnostics-${{ github.run_number }}
          path: |
            n1-toolchain.log
            n1-toolchain-packages.log
            openwrt/.config
          if-no-files-found: warn
          retention-days: 7
