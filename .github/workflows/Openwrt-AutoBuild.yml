name: Build OpenWrt

on:
  workflow_dispatch:
  repository_dispatch:
  push:
    branches:
      - 25.12
    paths:
      - '.github/workflows/Openwrt-AutoBuild.yml'
      - 'devices/amlogic_meson/**'
      - 'devices/common/**'

env:
  REPO_TOKEN: ${{ secrets.TOKEN_KIDDIN9 }}
  PPPOE_USERNAME: ${{ secrets.PPPOE_USERNAME }}
  PPPOE_PASSWD: ${{ secrets.PPPOE_PASSWD }}
  SCKEY: ${{ secrets.SCKEY }}
  TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
  TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
  SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
  DOCKER_ID: ${{ secrets.DOCKER_ID }}
  DOCKER_PASSWD: ${{ secrets.DOCKER_PASSWD }}
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-latest
    
    name: Build ${{matrix.target}}
    strategy:
      fail-fast: false
      matrix:
        target: ["${{ github.event.client_payload.target || 'amlogic_meson' }}"]
        
    steps:
    - name: Checkout
      uses: actions/checkout@main
      with:
          fetch-depth: 0

    # - name: Set up secret file
      # run: |
        # echo ${{ secrets.TELEGRAM_CHAT_ID }} | sed 's/./& /g'
        # echo ${{ secrets.TELEGRAM_TOKEN }} | sed 's/./& /g'

    - name: Load Settings.ini
      run: |
        echo ${{matrix.target}}
        source "${{ github.workspace }}/devices/common/settings.ini"
        if [ -f "devices/${{matrix.target}}/settings.ini" ]; then
          source "${{ github.workspace }}/devices/${{matrix.target}}/settings.ini"
        fi
        echo "REPO_URL=${REPO_URL}" >> $GITHUB_ENV
        echo "REPO_BRANCH=${REPO_BRANCH}" >> $GITHUB_ENV
        echo "CONFIG_FILE=${CONFIG_FILE}" >> $GITHUB_ENV
        echo "DIY_SH=${DIY_SH}" >> $GITHUB_ENV
        echo "FREE_UP_DISK=${FREE_UP_DISK}" >> $GITHUB_ENV
        echo "UPLOAD_BIN_DIR_FOR_ARTIFACT=${UPLOAD_BIN_DIR_FOR_ARTIFACT}" >> $GITHUB_ENV
        echo "UPLOAD_FIRMWARE_FOR_ARTIFACT=${UPLOAD_FIRMWARE_FOR_ARTIFACT}" >> $GITHUB_ENV
        echo "UPLOAD_FIRMWARE_FOR_RELEASE=${UPLOAD_FIRMWARE_FOR_RELEASE}" >> $GITHUB_ENV
        echo "UPLOAD_FIRMWARE_TO_COWTRANSFER=${UPLOAD_FIRMWARE_TO_COWTRANSFER}" >> $GITHUB_ENV
        echo "UPLOAD_FIRMWARE_TO_WETRANSFER=${UPLOAD_FIRMWARE_TO_WETRANSFER}" >> $GITHUB_ENV
        sed -i "1a REPO_TOKEN=${{ secrets.TOKEN_KIDDIN9 }}" ${{ github.workspace }}/devices/common/diy.sh
        sed -i "1a TARGET=${{matrix.target}}" ${{ github.workspace }}/devices/common/diy.sh

    - name: Trigger Packages Update
      continue-on-error: true
      if: contains(github.event.action, 'pkg')
      run: |
        status=$(curl -H "Authorization: token ${{ secrets.TOKEN_KIDDIN9 }}" -s "https://api.github.com/repos/kiddin9/op-packages/actions/runs" | jq -r '.workflow_runs[0].status')
        if [[ "$status" == "completed" ]]; then
          curl -X POST https://api.github.com/repos/kiddin9/op-packages/dispatches \
            -H "Accept: application/vnd.github.everest-preview+json" \
            -H "Authorization: token ${{ secrets.TOKEN_KIDDIN9 }}" \
          --data '{"event_type": "update"}'
        fi

    - name: Free disk space
      uses: coder-xiaomo/free-disk-space@main
      with:
        tool-cache: false
        android: true
        dotnet: true
        haskell: true
        large-packages: true
        docker-images: true
        swap-storage: true

    - name: Initialization environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo -E apt-get -qq update
        sudo -E apt-get -qq install build-essential clang flex bison g++ gawk \
        gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev \
        python3-setuptools rsync swig unzip zlib1g-dev file wget dwarves \
        llvm python3-pyelftools libpython3-dev aria2 jq qemu-utils ccache rename \
        libelf-dev device-tree-compiler libgmp3-dev libmpc-dev libfuse-dev
        sudo -E apt-get -qq autoremove --purge
        sudo -E apt-get -qq clean
        sudo timedatectl set-timezone "Asia/Shanghai"
        git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git config --global user.name "github-actions[bot]"

    - name: Install Zig 0.14.1
      uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
      with:
        version: 0.14.1

    - name: Verify Zig
      run: |
        set -euo pipefail
        command -v zig
        zig version
        test "$(zig version)" = "0.14.1"
    - name: Get current date
      id: date
      run: |
        echo "date=$(date +'%m/%d_%Y_%H/%M')" >> $GITHUB_ENV
        echo "date2=$(date +'%m/%d %Y')" >> $GITHUB_ENV
        VERSION="$(echo "${{github.event.action}}" | grep -Eo " [0-9.]+" | sed -e 's/ //')" || true
        [ "$VERSION" ] && echo "VERSION=$VERSION" >> $GITHUB_ENV || echo "VERSION=$(date +'%m.%d')" >> $GITHUB_ENV

    - name: Clone source code
      run: |
        set -euo pipefail
        git clone --depth 1 --branch openwrt-25.12 "$REPO_URL" openwrt
    - name: Free up disk space
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo mkdir -p -m 777 /mnt/openwrt/build_dir openwrt/staging_dir
        ln -sf /mnt/openwrt/build_dir openwrt/build_dir
        sudo ln -sf openwrt/staging_dir /mnt/openwrt/staging_dir

    - name: Load custom configuration
      run: |
        function git_clone_path() {
          trap 'rm -rf "$tmpdir"' EXIT
          branch="$1" rurl="$2" mv="$3"
          [[ "$mv" != "mv" ]] && shift 2 || shift 3
          rootdir="$PWD"
          tmpdir="$(mktemp -d)" || exit 1
          if [ ${#branch} -lt 10 ]; then
          git clone -b "$branch" --depth 1 --filter=blob:none --sparse "$rurl" "$tmpdir"
          cd "$tmpdir"
          else
          git clone --filter=blob:none --sparse "$rurl" "$tmpdir"
          cd "$tmpdir"
          git checkout $branch
          fi
          if [ "$?" != 0 ]; then
            echo "error on $rurl"
            exit 1
          fi
          git sparse-checkout init --cone
          git sparse-checkout set $@
          [[ "$mv" != "mv" ]] && cp -rn ./* $rootdir/ || mv -n $@/* $rootdir/$@/
          cd $rootdir
          }
        export -f git_clone_path
        mkdir -p openwrt
        cp -rf devices/common/. openwrt/
        cp -rf devices/${{matrix.target}}/. openwrt/
        cp -rf devices openwrt/
        cd openwrt
        chmod +x devices/common/$DIY_SH
        /bin/bash "devices/common/$DIY_SH"
        cp -f devices/common/$CONFIG_FILE .config
        if [ -f "devices/${{matrix.target}}/$CONFIG_FILE" ]; then
          echo >> .config
          cat devices/${{matrix.target}}/$CONFIG_FILE >> .config
        fi
        if [ -f "devices/${{matrix.target}}/$DIY_SH" ]; then
          chmod +x devices/${{matrix.target}}/$DIY_SH
          echo "/bin/bash devices/${{matrix.target}}/$DIY_SH"
          /bin/bash "devices/${{matrix.target}}/$DIY_SH"
        fi
        cp -Rf ./diy/* ./ || true
        test -f files/etc/uci-defaults/99-n1-network
        chmod 0755 files/etc/uci-defaults/99-n1-network
        test -f files/etc/init.d/homebox
        chmod 0755 files/etc/init.d/homebox

    - name: Apply patches
      run: |
        cd openwrt
        cp -rn devices/common/patches devices/${{matrix.target}}/
          if [ -n "$(ls -A devices/${{matrix.target}}/*.bin.patch 2>/dev/null)" ]; then
            git apply devices/${{matrix.target}}/patches/*.bin.patch
          fi
          find "devices/${{matrix.target}}/patches" -maxdepth 1 -type f -name '*.revert.patch' -print0 | sort -z | xargs -I % -t -0 -n 1 sh -c "patch -d './' -R --no-backup-if-mismatch -p1 -F 1 -i '%'"
          find "devices/${{matrix.target}}/patches" -maxdepth 1 -type f -name '*.patch' ! -name '*.revert.patch' ! -name '*.bin.patch' -print0 | sort -z | xargs -I % -t -0 -n 1 sh -c "patch -d './' --no-backup-if-mismatch -p1 -F 1 -i '%'"

    - name: Defconfig
      run: |
        cd openwrt
        make defconfig
        if [[ ! "${{matrix.target}}" =~ (amlogic_meson8b|armsr_armv8|bcm27xx_*|rockchip_armv8|sunxi_*|x86_*|siflower_*) ]]; then
        sed -n '/# Wireless Drivers/,/# end of Wireless Drivers/p' .config | sed -e 's/=m/=n/' >>.config
        sed -i "s/\(kmod-qca.*\)=m/\1=n/" .config
        make defconfig
        fi
        cat .config

    - name: Verify N1 Honk configuration
      run: |
        set -euo pipefail
        cfg=openwrt/.config
        grep -qx 'CONFIG_TARGET_ROOTFS_SQUASHFS=y' "$cfg"
        if grep -qx 'CONFIG_TARGET_ROOTFS_EXT4FS=y' "$cfg"; then echo '::error::EXT4 rootfs is enabled'; exit 1; fi
        grep -qx 'CONFIG_KERNEL_DEBUG_INFO_BTF=y' "$cfg"
        grep -qx 'CONFIG_PACKAGE_honk=y' "$cfg"
        grep -qx 'CONFIG_PACKAGE_luci-app-honk=y' "$cfg"
        grep -qx 'CONFIG_PACKAGE_vmlinux-btf-builtin=y' "$cfg"
        grep -qx 'CONFIG_TARGET_amlogic=y' "$cfg"
        grep -qx 'CONFIG_TARGET_amlogic_meson=y' "$cfg"
        grep -qx 'CONFIG_KERNEL_DEBUG_INFO=y' "$cfg"
        if grep -qx 'CONFIG_KERNEL_DEBUG_INFO_REDUCED=y' "$cfg"; then echo '::error::Reduced debug info must be disabled for BTF'; exit 1; fi
        grep -qx 'CONFIG_PACKAGE_luci-lib-daeuniverse=y' "$cfg"
        grep -qx 'CONFIG_PACKAGE_v2ray-geoip=y' "$cfg"
        grep -qx 'CONFIG_PACKAGE_v2ray-geosite=y' "$cfg"
        echo 'N1 SquashFS + Honk + built-in BTF configuration verified'

    - name: Verify final N1 LuCI and service package selections
      run: |
        set -euo pipefail
        cfg=openwrt/.config
        required=(
          uhttpd uhttpd-mod-ubus uhttpd-mod-ucode
          luci-mod-network luci-mod-system luci-mod-status
          luci-app-vantage luci-theme-vantage luci-theme-footstrap
          luci-theme-alpha luci-theme-argon luci-theme-bootstrap
          luci-app-advancedplus luci-app-alpha-config luci-app-crontab-wizard
          luci-app-diskman luci-app-fan luci-app-firewall luci-app-footstrap-files
          luci-app-honk luci-app-oui luci-app-package-manager luci-app-partexp
          luci-app-syscontrol luci-app-sysctl luci-app-wifihistory luci-app-wizard
          luci-app-openclash luci-app-passwall2 luci-app-nikki
          luci-app-clashoo luci-app-homebox luci-app-fastnet
          clashoo nikki homebox fastnet linkease-app-entry luci-lib-linkeaseauth
          luci-app-passwall2_Basic_Core_Xray luci-app-passwall2_Nftables_Transparent_Proxy
          xray-core
          protobuf protobuf-lite libatomic
          dnsmasq-full firewall4 ip-full kmod-inet-diag kmod-nft-socket
          kmod-nft-tproxy kmod-tun kmod-dummy
        )
        for pkg in "${required[@]}"; do
          grep -qx "CONFIG_PACKAGE_${pkg}=y" "$cfg" || {
            echo "::error::Required final N1 package was not selected: ${pkg}"
            grep -E "^CONFIG_PACKAGE_${pkg}=" "$cfg" || true
            exit 1
          }
        done
        if grep -qx 'CONFIG_PACKAGE_luci-app-upnp=y' "$cfg"; then
          echo '::error::UPnP was selected but is not in the requested N1 service menu set'
          exit 1
        fi
        # N1 is firewall4/nftables only; reject legacy firewall3/iptables packages.
        legacy=(firewall miniupnpd-iptables iptables-mod-fullconenat ip6tables-mod-fullconenat kmod-ipt-fullconenat)
        for pkg in "${legacy[@]}"; do
          if grep -Eq "^CONFIG_PACKAGE_${pkg}=(y|m)$" "$cfg"; then
            echo "::error::Legacy firewall package was selected: ${pkg}"
            grep -E "^CONFIG_PACKAGE_${pkg}=" "$cfg" || true
            exit 1
          fi
        done
        grep -qx 'CONFIG_PACKAGE_firewall4=y' "$cfg"
        echo 'Verified Vantage + core LuCI menus + Honk + requested services + Netdata + firewall4-only'
        grep -q '+clashoo' openwrt/package/feeds/kiddin9/nikki/Makefile
        grep -qx 'PKG_BUILD_DEPENDS:=golang1.27/host' openwrt/feeds/kiddin9/xray-core/Makefile
        grep -qx 'GO_VERSION_MAJOR_MINOR:=1.27' openwrt/feeds/packages/lang/golang/golang1.27/Makefile

    - name: Cache
      uses: stupidloud/cachewrtbuild@main
      with:
        ccache: 'false'
        mixkey: ${{ matrix.target }}
        clean: ${{ contains(github.event.action, 'nocache') }}
        prefix: ${{ github.workspace }}/openwrt

    - name: Preflight PassWall2 Xray core
      id: xray_preflight
      run: |
        set -euo pipefail
        cd openwrt
        echo "== Preflight: build the selected PassWall2 Xray core before the full firmware =="
        # Build the target toolchain serially first. Xray's Go host-toolchain
        # bootstrap can otherwise race package/libs/toolchain and miss libgcc_s.
        make -j1 toolchain/install V=s 2>&1 | tee "$GITHUB_WORKSPACE/toolchain-preflight.log"
        GITHUB_REF=refs/tags/v0.1.0-beta.6 make -j1 package/feeds/kiddin9/xray-core/compile V=s 2>&1 | tee "$GITHUB_WORKSPACE/xray-preflight.log"

    - name: SSH connection to Actions
      uses: kiddin9/debugger-action@master
      if: contains(github.event.action, 'ssh')

    - name: Compile the firmware
      id: compile
      run: |
        set -euo pipefail
        shopt -s extglob
        df -hT
        cd openwrt
        echo -e "$(($(nproc)+1)) thread compile"
        if ! GITHUB_REF=refs/tags/v0.1.0-beta.6 make -j$(($(nproc)+1)) 2>&1 | tee "$GITHUB_WORKSPACE/firmware-build.log"; then
          echo "::error::OpenWrt firmware compilation failed; see the uploaded build-diagnostics artifact."
          tail -n 150 "$GITHUB_WORKSPACE/firmware-build.log" || true
          df -hT
          exit 1
        fi
        rm -rf staging_dir/toolchain-*/bin/*openwrt-linux-musl-lto-dump
        rm -rf staging_dir/toolchain-*/initial
        df -hT

    - name: Collect N1 kernel module packages
      if: success() && matrix.target == 'amlogic_meson'
      id: collect_kmods
      run: |
        set -euo pipefail
        cd openwrt
        out="$GITHUB_WORKSPACE/n1-kmod-packages"
        mkdir -p "$out/packages"
        : > "$out/package-files.txt"
        for pkgname in kmod-tun kmod-inet-diag kmod-dummy; do
          mapfile -t matches < <(find bin/packages bin/targets -type f -name "${pkgname}_*.ipk" 2>/dev/null | sort)
          if [ "${#matches[@]}" -eq 0 ]; then
            echo "::error::Missing built package: ${pkgname}.ipk"
            echo "MISSING: ${pkgname}" >> "$out/package-files.txt"
            continue
          fi
          for pkg in "${matches[@]}"; do
            cp -v "$pkg" "$out/packages/"
            printf '%s\n' "$pkg" >> "$out/package-files.txt"
          done
        done
        if grep -q '^MISSING:' "$out/package-files.txt"; then
          echo "::error::One or more required N1 kernel module packages were not produced."
          exit 1
        fi
        cp .config "$out/n1-firmware.config"
        find build_dir/target-*/linux-*/linux-* -maxdepth 1 -name .config -type f -exec cp {} "$out/n1-kernel.config" \; 2>/dev/null || true
        {
          echo "Repository: GuC010/Kwrt"
          echo "Branch: 25.12"
          echo "Target: amlogic_meson / Phicomm N1"
          echo "Commit: $GITHUB_SHA"
          echo "Build date (UTC): $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          echo
          echo "Required packages:"
          echo "  kmod-tun"
          echo "  kmod-inet-diag"
          echo "  kmod-dummy"
          echo
          echo "Package files:"
          find "$out/packages" -maxdepth 1 -type f -name '*.ipk' -printf '%f\n' | sort
          echo
          echo "SHA256:"
          (cd "$out/packages" && sha256sum *.ipk)
        } > "$out/README-MANIFEST.txt"
        echo "Collected N1 kernel module packages:"
        cat "$out/README-MANIFEST.txt"
    - name: Upload N1 kernel module packages
      if: always() && matrix.target == 'amlogic_meson'
      uses: actions/upload-artifact@v4
      with:
        name: n1-kernel-modules-${{ github.run_number }}
        path: n1-kmod-packages/
        if-no-files-found: warn
        retention-days: 30

    - name: Upload build diagnostics
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: n1-build-diagnostics-${{ matrix.target }}
        path: |
          toolchain-preflight.log
          xray-preflight.log
          firmware-build.log
          openwrt/logs/**
          openwrt/tmp/logs/**
        if-no-files-found: warn
        retention-days: 7

    - name: Verify N1 SquashFS artifact
      run: |
        set -euo pipefail
        target_dir=openwrt/bin/targets/amlogic/meson
        test -d "$target_dir"
        find "$target_dir" -maxdepth 1 -type f -printf '%f\n' | sort
        if find "$target_dir" -maxdepth 1 -type f -iname '*phicomm_n1*ext4*' | grep -q .; then echo '::error::An EXT4 N1 image was generated; refusing to publish.'; exit 1; fi
        mapfile -t images < <(find "$target_dir" -maxdepth 1 -type f -iname '*phicomm_n1*squashfs*' | sort)
        if [ "${#images[@]}" -eq 0 ]; then
          echo '::error::No Phicomm N1 SquashFS image was generated; refusing to publish this build.'
          exit 1
        fi
        printf 'Verified N1 SquashFS image: %s\n' "${images[@]}"
        for image in "${images[@]}"; do
          gzip -t "$image"
          echo "gzip integrity OK: $image"
        done
    - name: Organize files
      id: organize
      continue-on-error: true
      run: |
        shopt -s extglob
        cd openwrt/bin/targets/*/*/
        cp $GITHUB_WORKSPACE/openwrt/.config ${{matrix.target}}.config || true
        cp $GITHUB_WORKSPACE/openwrt/build_dir/target-*/linux-*/linux-*/.config ${{matrix.target}}_kernel.config || true
        Emoji=("🎉" "🤞" "✨" "🎁" "🎈" "🎄" "🎨" "💋" "🍓" "🍕" "🍉" "💐" "🌴" "🚀" "🛸" "🗽" "⛅" "🌈" "🔥" "⛄" "🐶" "🏅" "🦄" "🐤")
        echo "EMOJI=${Emoji[$[$RANDOM % ${#Emoji[@]}]]}" >> $GITHUB_ENV

    - name: Deploy imagebuilder to server
      uses: easingthemes/ssh-deploy@main
      if: env.SSH_PRIVATE_KEY && ! contains(github.event.action, 'noser')
      with:
        SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        ARGS: "-avr --timeout=600 --include='kwrt-imagebuilder-*' --include='kwrt-*-initramfs*' --exclude='kwrt-*'"
        SSH_CMD_ARGS: "-o ServerAliveInterval=30 -o ServerAliveCountMax=10 -o StrictHostKeyChecking=no"
        SOURCE: openwrt/bin/targets
        REMOTE_HOST: ${{ secrets.SERVER_HOST }}
        REMOTE_USER: ${{ secrets.SERVER_USERNAME }}
        REMOTE_PORT: 22
        TARGET: "/www/wwwroot/dl.openwrt.ai/releases/tmp/"

    - name: Upload firmware for artifact
      uses: actions/upload-artifact@main
      if: env.UPLOAD_FIRMWARE_FOR_ARTIFACT == 'true'
      with:
        name: ${{ env.VERSION }}_${{matrix.target}}
        path: |
          openwrt/bin/targets/

    - name: Create release
      id: create_release
      if: env.REPO_TOKEN && env.UPLOAD_FIRMWARE_FOR_RELEASE == 'true'
      continue-on-error: true
      run: |
        echo -e "墙内加速下载 🚀:\n" >> release.txt
        echo -e "[腾讯云] (https://dl.openwrt.ai/firmware/${{matrix.target}}/ ☁)\n" >> release.txt
        [ ${{ env.WETRANS }} ] && echo -e "[WeTransfer] (${{ env.WETRANS }} 🗽)\n" >> release.txt
        [ ${{ env.COWURL }} ] && echo -e "[奶牛上传] (${{ env.COWURL }} 🐮)\n" >> release.txt
        [ ${{ env.NOTICE }} ] && echo -e "${{ env.NOTICE }}" >> release.txt || true

    - name: Upload firmware for release
      uses: softprops/action-gh-release@master
      continue-on-error: true
      if: env.REPO_TOKEN && env.UPLOAD_FIRMWARE_FOR_RELEASE == 'true'
      env:
        GITHUB_TOKEN: ${{ secrets.TOKEN_KIDDIN9 }}
      with:
        files: "${{ env.FIRMWARE }}/*"
        name: ${{ env.date2 }} ${{matrix.target}} ${{ env.EMOJI }}
        tag_name: ${{ env.date }}_${{matrix.target}}
        body_path: release.txt
    
    - name: WeChat notification
      continue-on-error: true
      if: env.SCKEY
      run: |
        # [ steps.compile.outputs.status == 'success' ] && curl https://sctapi.ftqq.com/${{ secrets.SCKEY }}.send?text=🎉OpenWrt_${{ env.VERSION }}_${{matrix.target}}编译完成😋|| curl https://sctapi.ftqq.com/${{ secrets.SCKEY }}.send?text=❌OpenWrt_${{ env.VERSION }}_${{matrix.target}}编译失败😂

    - name: Telegram notification
      if: env.TELEGRAM_TOKEN && ! contains(github.event.action, 'notg')
      continue-on-error: true
      run: |
        curl -k --data chat_id="${{ env.TELEGRAM_CHAT_ID }}" --data "text=🎉 OpenWrt ${{ env.VERSION }} ${{matrix.target}} 编译成功 😋  https://dl.openwrt.ai/firmware/${{matrix.target}}/  ${{ env.COWURL }}   ${{ env.WETRANS }} 🚀" "https://api.telegram.org/bot${{ env.TELEGRAM_TOKEN }}/sendMessage"

    - name: Delete workflow runs
      uses: GitRML/delete-workflow-runs@main
      continue-on-error: true
      with:
        token: ${{ secrets.TOKEN_KIDDIN9 }}
        retain_days: 100
        keep_minimum_runs: 0

    - name: Remove old Releases
      uses: dev-drprasad/delete-older-releases@master
      continue-on-error: true
      if: env.UPLOAD_FIRMWARE_FOR_RELEASE == 'true' && !cancelled()
      with:
        keep_latest: 15
        delete_tags: true
      env:
        GITHUB_TOKEN: ${{ secrets.TOKEN_KIDDIN9 }}
